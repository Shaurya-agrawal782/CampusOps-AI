services:
  # Backend Node.js API
  - type: web
    name: campusops-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # Frontend React SPA
  - type: web
    name: campusops-client
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: campusops-api
          envVarKey: RENDER_EXTERNAL_URL
    # Ensure React Router works by redirecting all traffic to index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
